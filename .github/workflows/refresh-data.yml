name: Refresh public apartment data
on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apartment-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 openpyxl==3.1.5
      - name: Collect official public sources
        run: |
          node scripts/build-market-data.mjs --refresh
          python scripts/refresh-complexes.py
          node scripts/build-place-data.mjs --refresh
      - name: Validate before publishing
        run: |
          node --test
          node scripts/validate-data.mjs
          node scripts/build-site.mjs
      - name: Publish only after every check succeeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json rail-data.json station-data.json seoul_apt_complex.json seoul_apt_locations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated public apartment data'
            git push origin HEAD:master
          fi
      - name: Confirm production catches up
        run: node scripts/check-production.mjs
      - name: Record failure policy
        if: failure()
        run: echo 'Refresh or publish verification failed. Collection/test failures leave the last published snapshot intact. See the failed step before retrying.' >> "$GITHUB_STEP_SUMMARY"
